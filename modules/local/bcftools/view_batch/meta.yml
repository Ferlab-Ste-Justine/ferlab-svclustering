name: bcftools_view
description: View, subset and filter VCF or BCF files by position and filtering expression.
  Convert between VCF and BCF
keywords:
  - variant calling
  - view
  - bcftools
  - VCF
tools:
  - view:
      description: |
        View, subset and filter VCF or BCF files by position and filtering expression. Convert between VCF and BCF
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      doi: 10.1093/bioinformatics/btp352
      licence: ["MIT"]
      identifier: biotools:bcftools
input:
  - - meta_list:
        type: list
        description: |
          List of groovy Maps, each containing sample information
          e.g. [[ id:'sample1', single_end:false ], [id: 'sample2', single_end:true]]
    - vcf_list:
        type: file
        description: |
          The list of vcf files to be inspected. Must be ordered consistently with meta_list
          e.g. ['sample1.vcf.gz', 'sample2.vcf.gz']
    - index_list:
        type: file
        description: |
          The list of index files matching the VCF files to be inspected.
          e.g. ['sample1.vcf.gz.tbi', 'sample2.vcf.gz.tbi']
  - - meta_output_key:
        type: string
        description: |
          The key in the sample meta dictionary used to store the output file
          names associated to the sample.
          e.g. 'output'
  - - regions:
        type: file
        description: |
          Optionally, restrict the operation to regions listed in this file.
          e.g. 'file.vcf'
  - - targets:
        type: file
        description: |
          Optionally, restrict the operation to regions listed in this file (doesn't rely upon index files)
          e.g. 'file.vcf'
  - - samples:
        type: file
        description: |
          Optional, file of sample names to be included or excluded.
          e.g. 'file.tsv'
output:
  - vcf:
      - meta_list:
          type: list
          description: |
            List of Groovy Map, each containing information for a specific sample.
            The output files applicable to each sample are stored in the key specified
            by 'meta_output_key' passed as input.
            e.g. [
              [ id:'sample1', single_end:false, output:['sample1.viewed.vcf.gz', 'sample1.viewed.vcf.gz.tbi']],
              [ id:'sample2', single_end:true,  output:['sample2.viewed.vcf.gz', 'sample2.viewed.vcf.gz.tbi']]
            ]
      - "*.{vcf,vcf.gz,bcf,bcf.gz}":
          type: file
          description: VCF normalized output files corresponding to the different samples
          pattern: "*.{vcf,vcf.gz,bcf,bcf.gz}"
  - tbi:
      - meta_list:
          type: list
          description: |
            List of Groovy Map, each containing information for a specific sample.
            The output files applicable to each sample are stored in the  key specified
            by 'meta_output_key' passed as input.
            e.g. [
              [ id:'sample1', single_end:false, output:['sample1.viewed.vcf.gz', 'sample1.viewed.vcf.gz.tbi']],
              [ id:'sample2', single_end:true,  output:['sample2.viewed.vcf.gz', 'sample2.viewed.vcf.gz.tbi']]
            ]
      - "*.tbi":
          type: file
          description: VCF files indexes (tbi format) corresponding to the different samples
          pattern: "*.tbi"
  - csi:
      - meta_list:
          type: list
          description: |
            List of Groovy Map, each containing information for a specific sample.
            The output files applicable to each sample are stored in the  key specified
            by 'meta_output_key' passed as input.
            e.g. [
              [ id:'sample1', single_end:false, output:['sample1.viewed.vcf.gz', 'sample1.viewed.vcf.gz.csi']],
              [ id:'sample2', single_end:true,  output:['sample2.viewed.vcf.gz', 'sample2.viewed.vcf.gz.csi']]
            ]
      - "*.csi":
          type: file
          description: VCF file indexes (csi format) corresponding to the different samples
          pattern: "*.csi"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@abhi18av"
maintainers:
  - "@abhi18av"
